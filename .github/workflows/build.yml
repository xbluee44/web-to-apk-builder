name: Build APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Replace placeholders
        run: |
          URL="${{ github.event.client_payload.url }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PKG="${{ github.event.client_payload.package }}"
          
          find template -name "*.template" | while read f; do
            out="${f%.template}"
            sed "s|{{URL}}|$URL|g; s|{{APP_NAME}}|$APP_NAME|g; s|{{PACKAGE}}|$PKG|g" "$f" > "$out"
          done
          
          # Pindah ke folder yang sesuai
          mkdir -p app
          cp -r template/* app/
          rm -rf template

      - name: Build APK
        run: |
          cd app
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.0 || true
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/app/build/outputs/apk/debug/app-debug.apk
